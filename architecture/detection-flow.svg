      <text class="card-title" x="12" y="95" fill="#c53030">A02: Suspicious Web Download</text>
      <text class="card-desc" x="12" y="111">Suricata SID 1101002 (Inbound ZIP)</text>
      <text class="card-desc" x="12" y="125">HTTP GET from 203.0.113.25:80</text>

