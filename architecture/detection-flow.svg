<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 700; font-size: 22px; fill: #1a202c; }
      .subtitle { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-size: 13px; fill: #718096; }
      .section-title { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.5px; }
      .card-title { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 700; font-size: 11.5px; fill: #1a202c; }
      .card-desc { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-size: 10px; fill: #4a5568; line-height: 1.3; }
      .zone-box { rx: 8; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .node-card { rx: 6; stroke-width: 1.5; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .flow-arrow { stroke-width: 1.5; fill: none; stroke: #4a5568; marker-end: url(#arrow-gray); }
      .join-arrow { stroke-width: 2.5; stroke: #e53e3e; fill: none; stroke-dasharray: 5,3; marker-end: url(#arrow-red); }
      .drill-arrow { stroke-width: 2; stroke: #319795; fill: none; stroke-dasharray: 4,3; marker-end: url(#arrow-teal); }
    </style>

    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4a5568" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
