  <path class="telemetry-arrow" d="M 580 380 C 680 380, 680 270, 770 270" stroke="#805ad5" />
  <path class="telemetry-arrow" d="M 720 530 C 740 530, 740 290, 770 290" stroke="#805ad5" />

  <!-- PIPELINE ARROWS INSIDE SIEM -->
  <path class="flow-arrow" d="M 935 120 L 935 145" stroke="#805ad5" />
  <path class="flow-arrow" d="M 935 295 L 935 325" stroke="#805ad5" />
  <path class="flow-arrow" d="M 935 435 L 935 465" stroke="#805ad5" />
  <path class="flow-arrow" d="M 935 600 L 935 625" stroke="#319795" />

  <!-- FOOTER -->
  <text x="40" y="855" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a0aec0">Enterprise SOC Lab Portfolio • Architecture Level 1 Specification • Verified Empirical Baseline (ArcSight ESM + Logger + pfSense + Suricata)</text>
</svg>
